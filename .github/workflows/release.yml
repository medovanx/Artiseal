name: Release

# Pushing a tag like v1.2.3 builds, tests and publishes that version as a GitHub release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance
  attestations: write   # store the build provenance

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a SemVer tag: ${{ github.ref_name }}" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true', "-p:Version=$v",
                      '-p:PublishSingleFile=true', '-p:EnableCompressionInSingleFile=true', '-p:DebugType=none')
          dotnet publish src/Artiseal.App @common -p:IncludeNativeLibrariesForSelfExtract=true -o out/app
          dotnet publish src/Artiseal.Cli @common -o out/cli
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item README.md, LICENSE out/app; Copy-Item README.md, LICENSE out/cli
          Compress-Archive out/app/* "dist/Artiseal-$v-win-x64.zip"
          Compress-Archive out/cli/* "dist/artiseal-cli-$v-win-x64.zip"
          # LF line endings, as sha256sum -c expects on every platform.
          $sums = Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($sums -join "`n") + "`n")

      # The release can be checked with Artiseal itself. GitHub only stores attestations for public repos
      # on free plans, so this step runs once the repo is public.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

      - name: Notes from the changelog
        shell: pwsh
        run: |
          $v = [regex]::Escape('${{ steps.version.outputs.version }}')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$v\][^\n]*\n(.*?)(?=^## \[|^\[)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}" }
          $m.Groups[1].Value.Trim() | Set-Content notes.md -Encoding utf8

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--title', 'Artiseal ${{ steps.version.outputs.version }}', '--notes-file', 'notes.md', '--verify-tag')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/* @flags
